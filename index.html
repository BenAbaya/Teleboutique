<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenAbaya - Boutique</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="max-w-6xl mx-auto p-4">
  <h1 class="text-3xl font-bold text-center mb-6">BenAbaya 🛍️</h1>
  
  <div class="bg-white p-4 rounded-lg shadow mb-6">
    <h2 class="font-bold mb-3">Publier un produit</h2>
    <input id="nom" placeholder="Nom du produit" class="border p-2 w-full mb-2 rounded">
    <input id="prix" type="number" placeholder="Prix FCFA" class="border p-2 w-full mb-2 rounded">
    <button onclick="publier()" class="bg-blue-500 text-white px-4 py-2 rounded w-full">Publier</button>
  </div>

  <div id="liste" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "BGxsCpBOS97I0XUenkVN6F-7YeKpUsKgecKl7WNiwAdS-kyZFWyjhvwPFeaqY6-Dbae_rH4HusoVGd1Rt0iL4y4",
    authDomain: "teleboutique-5d7ad.firebaseapp.com",
    projectId: "teleboutique-5d7ad",
    storageBucket: "teleboutique-5d7ad.appspot.com",
    messagingSenderId: "386421536162",
    appId: "1:386421536162:web:default" // Firebase va accepter avec apiKey
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function publier() {
    const nom = document.getElementById('nom').value;
    const prix = document.getElementById('prix').value;
    if(!nom || !prix) return alert('Remplis tout');
    await addDoc(collection(db, "produits"), { nom, prix, date: new Date() });
    document.getElementById('nom').value = '';
    document.getElementById('prix').value = '';
    alert('Produit publié !');
  }

  const q = query(collection(db, "produits"), orderBy("date", "desc"));
  onSnapshot(q, (snapshot) => {
    const liste = document.getElementById('liste');
    liste.innerHTML = '';
    snapshot.forEach(doc => {
      const p = doc.data();
      liste.innerHTML += `
        <div class="bg-white p-4 rounded-lg shadow">
          <h3 class="font-bold">${p.nom}</h3>
          <p class="text-green-600 font-bold">${p.prix} FCFA</p>
        </div>`
    });
  });
  window.publier = publier;
</script>
</body>
</html>
