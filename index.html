<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENABAYA - Marketplace Cameroun V6.16</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#222;--primary:#25D366}
body.dark{--bg:#121212;--card:#1e1e1e;--text:#eee}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:var(--text)}
header{background:var(--primary);color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:bold}
.btn{padding:8px 12px;border:none;border-radius:8px;cursor:pointer;margin:4px}
.btn-buy{background:#007bff;color:#fff}
.btn-whatsapp{background:#25D366;color:#fff}
.btn-chat{background:#ff9800;color:#fff}
.card{background:var(--card);padding:12px;margin:10px;border-radius:12px;box-shadow:0 2px 5px #0001}
input,textarea{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<header>BENABAYA V6.16 - Marketplace Cameroun</header>

<div id="app">
  <h3 style="padding:10px">Publier un produit</h3>
  <div class="card">
    <input id="titre" placeholder="Titre du produit">
    <textarea id="desc" placeholder="Description"></textarea>
    <input id="prix" placeholder="Prix FCFA">
    <input id="tel" placeholder="Numéro WhatsApp">
    <button class="btn" onclick="publier()">Publier</button>
  </div>

  <h3 style="padding:10px">Produits</h3>
  <div id="liste"></div>
</div>

<script>
// 1. COLLE ICI TA CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "COLLE_TA_CLE_ICI",
  authDomain: "benabaya.firebaseapp.com",
  projectId: "benabaya",
  storageBucket: "benabaya.appspot.com",
  appId: "COLLE_TON_APPID_ICI"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 2. PUBLIER
function publier(){
  const data = {
    titre: titre.value,
    desc: desc.value,
    prix: prix.value,
    tel: tel.value,
    date: new Date()
  }
  db.collection("produits").add(data);
  titre.value="";desc.value="";prix.value="";tel.value="";
}

// 3. AFFICHER EN TEMPS REEL
db.collection("produits").orderBy("date","desc").onSnapshot(snap=>{
  liste.innerHTML="";
  snap.forEach(doc=>{
    const p = doc.data();
    liste.innerHTML += `
    <div class="card">
      <h4>${p.titre}</h4>
      <p>${p.desc}</p>
      <b>${p.prix} FCFA</b><br>
      <button class="btn btn-buy" onclick="commander('${p.titre}')">Commander</button>
      <button class="btn btn-whatsapp" onclick="window.open('https://wa.me/237${p.tel}')">WhatsApp</button>
      <button class="btn btn-chat" onclick="alert('Chat avec le vendeur bientôt')">Discuter</button>
    </div>`
  })
})

function commander(titre){
  alert("Commande pour: "+titre+" envoyée au vendeur")
}
</script>
</body>
</html>
